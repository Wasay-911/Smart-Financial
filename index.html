<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Mohallah Logestic – Truck Simulation RPG. Drive trucks across Pakistan, deliver cargo, earn money and build your logistics empire.">
  <title>Mohallah Logestic – Truck Simulation RPG</title>
  <!-- Inline SVG favicon – no 404 errors -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle'%3E🚛%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading splash (hidden once game starts) -->
<div id="loading">
  <div class="spinner"></div>
  MOHALLAH LOGESTIC
</div>

<canvas id="c"></canvas>

<script type="module" src="js/game.js"></script>
<script>
  // Hide loading splash when game module is ready
  window.addEventListener('load', () => {
    setTimeout(() => {
      const el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
      setTimeout(() => el && el.remove(), 600);
    }, 400);
  });
</script>
</body>
</html>
